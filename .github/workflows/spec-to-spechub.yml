name: spec-to-spechub

# Engineering commits a spec to GitHub. This workflow diffs it against the spec
# currently in Postman Spec Hub, alerts reviewers, waits for approval, then updates
# Spec Hub and regenerates the linked collection. Nothing is written back to Git.

# Two modes (default: gate):
#   gate = alert, then wait for a human to approve before Spec Hub is updated
#   auto = alert, then push straight into the Working workspace; the team reviews
#          when they pull Working -> Staging in Postman
# Pick the mode with the repo variable SPEC_MODE (push-triggered runs) or the
# "mode" input (manual runs; the input wins).

on:
  push:
    branches: [main]
    paths: ['specs/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate = wait for approval, auto = push straight to Working'
        type: choice
        options: [gate, auto]
        default: gate

permissions:
  contents: write   # commit comment for the alert

env:
  SPEC_ID: 11360fd7-754a-49ef-9cdf-fa193bad5aaa          # Working spec: the one the publish job updates
  STAGING_SPEC_ID: 30aeab30-6628-46ca-a4be-34cdfecbf01d  # Staging spec: what the reviewers currently see
  STAGING_WORKSPACE_ID: b0c6742d-2a77-44b6-a6dc-69bded924678  # where the auto-mode announcement is posted
  COLLECTION_UID: 52509354-fbcaeb1b-223c-4c84-b408-fcb16420057e
  SPEC_FILE: accounts.yaml

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.d.outputs.changed }}
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mode
        id: m
        run: |
          mode="${{ inputs.mode || vars.SPEC_MODE || 'gate' }}"
          case "$mode" in gate|auto) ;; *) echo "Unknown mode '$mode', using gate"; mode=gate;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - name: Fetch the approved spec from Spec Hub
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          MODE: ${{ steps.m.outputs.mode }}
        run: |
          mkdir -p diff
          # auto: Working updates on every commit, so compare against Staging, the copy
          # the reviewers see. The alert then lists everything they have not accepted yet.
          # gate: Spec Hub is only updated on approval, so Working is already the baseline.
          if [ "$MODE" = "auto" ]; then BASE_ID="$STAGING_SPEC_ID"; else BASE_ID="$SPEC_ID"; fi
          curl -sf "https://api.postman.com/specs/$BASE_ID/files/$SPEC_FILE" \
            -H "X-API-Key: $POSTMAN_API_KEY" | jq -r .content > diff/base.yaml
          cp "specs/$SPEC_FILE" diff/new.yaml

      - name: Diff (oasdiff)
        id: d
        run: |
          docker run --rm -v "$PWD/diff:/data" tufin/oasdiff changelog /data/base.yaml /data/new.yaml > diff/changelog.txt || true
          docker run --rm -v "$PWD/diff:/data" tufin/oasdiff breaking /data/base.yaml /data/new.yaml > diff/breaking.txt || true
          # oasdiff prints "No changes detected" for identical specs, so an empty check is not enough
          if [ -s diff/changelog.txt ] && ! grep -q "No changes detected" diff/changelog.txt; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Alert reviewers
        if: steps.d.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MODE: ${{ steps.m.outputs.mode }}
        run: |
          {
            if [ "$MODE" = "auto" ]; then echo "## Spec change detected: updating the Working workspace"; else echo "## Spec change detected: awaiting review"; fi
            echo
            echo "Commit \`${GITHUB_SHA::7}\` changes \`$SPEC_FILE\` compared with the spec in Spec Hub."
            echo
            echo "### All changes"; echo '```'; cat diff/changelog.txt; echo '```'
            echo "### Breaking changes"; echo '```'; if [ -s diff/breaking.txt ]; then cat diff/breaking.txt; else echo "none"; fi; echo '```'
            echo
            if [ "$MODE" = "auto" ]; then
              echo "Mode: **auto**. The Working workspace is updated automatically. Review the change in Postman: Staging, then Pull Changes."
            else
              echo "Mode: **gate**. Approve the **spechub-approval** environment in the next job to update Spec Hub and regenerate the collection."
            fi
          } > diff/alert.md
          cat diff/alert.md >> "$GITHUB_STEP_SUMMARY"
          # auto: the alert goes to Postman (see the publish job), not to GitHub
          if [ "$MODE" != "auto" ]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@diff/alert.md > /dev/null
          fi
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            jq -n --rawfile t diff/alert.md '{text:$t}' | curl -s -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" > /dev/null
          fi

      - name: Keep the alert for the publish job
        if: steps.d.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alert
          path: diff/alert.md

  publish:
    needs: diff
    if: needs.diff.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # gate -> spechub-approval (required reviewer); auto -> spechub-auto (no reviewers)
    environment: ${{ needs.diff.outputs.mode == 'auto' && 'spechub-auto' || 'spechub-approval' }}
    steps:
      - uses: actions/checkout@v4

      - name: Update the spec in Spec Hub
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          jq -Rs '{content: .}' "specs/$SPEC_FILE" > body.json
          curl -sf -X PATCH "https://api.postman.com/specs/$SPEC_ID/files/$SPEC_FILE" \
            -H "X-API-Key: $POSTMAN_API_KEY" -H "Content-Type: application/json" -d @body.json > /dev/null
          echo "Spec Hub updated."

      - name: Regenerate the linked collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' -X PUT \
            "https://api.postman.com/collections/$COLLECTION_UID/synchronizations?specId=$SPEC_ID" \
            -H "X-API-Key: $POSTMAN_API_KEY")
          if [ "$code" = "400" ] && grep -q "already in sync" resp.json; then echo "Collection already in sync."; exit 0; fi
          [ "$code" = "202" ] || { echo "Sync request failed ($code)"; cat resp.json; exit 1; }
          url=$(jq -r .url resp.json)
          for i in $(seq 1 30); do
            s=$(curl -s "https://api.postman.com$url" -H "X-API-Key: $POSTMAN_API_KEY" | jq -r .status)
            echo "sync status: $s"
            [ "$s" = "completed" ] && {
              if [ "${{ needs.diff.outputs.mode }}" = "auto" ]; then echo "### Working workspace updated. Review it in Postman: Staging, then Pull Changes." >> "$GITHUB_STEP_SUMMARY"; else echo "### Spec Hub updated and collection regenerated" >> "$GITHUB_STEP_SUMMARY"; fi
              exit 0; }
            [ "$s" = "failed" ] && exit 1
            sleep 4
          done
          echo "Timed out waiting for collection sync"; exit 1

      # auto only: announce the change inside Postman, in the Staging workspace's Updates tab,
      # once Working holds it, so Pull Changes is already available when the team opens Staging.
      - name: Fetch the alert text
        if: needs.diff.outputs.mode == 'auto'
        uses: actions/download-artifact@v4
        with:
          name: alert
          path: alert

      - name: Post the workspace update
        if: needs.diff.outputs.mode == 'auto'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          {
            echo "Commit \`${GITHUB_SHA::7}\` changed \`$SPEC_FILE\` in GitHub. The Working workspace is updated; Staging is not yet."
            echo
            echo "To review: Staging workspace, Specs, Accounts API, three-dot menu, Pull Changes. After accepting, click Update Collection."
            echo
            sed -n '/### All changes/,$p' alert/alert.md | sed '/^Mode:/,$d'
          } > announce.md
          jq -n --rawfile d announce.md '{topic:"Spec change detected in GitHub", category:"announcement", description:$d}' > announce.json
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST "https://api.postman.com/workspaces/$STAGING_WORKSPACE_ID/updates" \
            -H "X-API-Key: $POSTMAN_API_KEY" -H "Content-Type: application/json" -d @announce.json)
          [ "$code" = "200" ] || { echo "Workspace update failed ($code)"; cat resp.json; exit 1; }
          echo "### Announcement posted in the Staging workspace (Updates tab)." >> "$GITHUB_STEP_SUMMARY"
